name: speedtest

on:
  # 定时已收敛到 pipeline.yml（单一流水线按 needs 显式排序）；这里保留手动触发用于排障
  workflow_dispatch:

permissions:
  contents: write

jobs:
  speed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install mihomo
        run: |
          set -e
          URL=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=(j.assets||[]).find(x=>/linux-amd64-compatible/.test(x.name)&&/\.gz$/.test(x.name));console.log(a?a.browser_download_url:'')})")
          echo "asset=$URL"
          curl -sSL -o mihomo.gz "$URL"
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v | head -2

      - name: Run speedtest
        run: node scripts/speedtest.mjs
        env:
          MIHOMO_BIN: ./mihomo
          SAMPLE: 100

      - name: Purge jsDelivr
        run: |
          curl -s -m 30 "https://purge.jsdelivr.net/gh/jingjiangze/node-radar@main/dist/clash.yaml" || true
          curl -s -m 30 "https://purge.jsdelivr.net/gh/jingjiangze/node-radar@main/dist/speed-top.yaml" || true

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/speed.json dist/speed-top.yaml
          git diff --cached --quiet || git commit -m "chore: 更新实测速度与极速订阅"
          git push

      - name: Show result
        run: node -e "const s=require('./dist/speed.json');console.log('tested',s.sample,'ok',s.ok,'median',s.medianMbps,'MB/s')"
