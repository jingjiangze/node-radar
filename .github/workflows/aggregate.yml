name: aggregate-nodes

on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时
  workflow_dispatch:

# 同一时间只跑一个：并发运行会在 push 阶段互相顶掉（! [rejected] main -> main (fetch first)）
concurrency:
  group: aggregate-nodes
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIST_ID: ${{ secrets.GIST_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: node scripts/aggregate.mjs

      - name: Show summary
        run: node -e "const s=require('./dist/summary.json');console.log('alive',s.totalAlive,'degraded',s.degraded,'regions',JSON.stringify(s.regions))"

      - name: Install mihomo (for validation)
        run: |
          set -e
          URL=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=(j.assets||[]).find(x=>/linux-amd64-compatible/.test(x.name)&&/\.gz$/.test(x.name));console.log(a?a.browser_download_url:'')})")
          curl -sSL -o mihomo.gz "$URL" && gunzip -f mihomo.gz && chmod +x mihomo

      # 关键兜底：生成物必须能被内核加载，否则不发布（不提交、不覆盖线上）
      - name: Validate generated config
        run: |
          set -e
          if [ -f dist/clash.yaml ]; then ./mihomo -t -d . -f dist/clash.yaml && echo "clash.yaml OK"; fi
          if [ -f dist/clash-lite.yaml ]; then ./mihomo -t -d . -f dist/clash-lite.yaml && echo "clash-lite.yaml OK"; fi
          if [ -f dist/speed-top.yaml ]; then ./mihomo -t -d . -f dist/speed-top.yaml && echo "speed-top.yaml OK"; fi

      - name: Purge jsDelivr cache
        run: |
          curl -s -m 30 "https://purge.jsdelivr.net/gh/jingjiangze/node-radar@main/dist/clash.yaml" || true

      # 状态持久化：源健康度跨运行累积，否则「连续失败 3 次剔除」形同虚设
      - name: Publish dist back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          git add -f dist/clash.yaml dist/clash-lite.yaml dist/summary.json
          [ -f sources.health.json ] && git add -f sources.health.json || true
          git diff --cached --quiet || git commit -m "chore: update aggregated subscription"
          # 远端可能已被别的运行推进过，先 rebase 再推，避免 (fetch first) 直接失败
          git pull --rebase --autostash origin main || true
          git push

      # 冒烟：发布后再从公网取一次，确认线上就是这份
      - name: Smoke test published file
        run: |
          set -e
          sleep 5
          curl -fsSL -m 60 -o published.yaml "https://raw.githubusercontent.com/jingjiangze/node-radar/main/dist/clash.yaml"
          ./mihomo -t -d . -f published.yaml && echo "published OK ($(wc -c < published.yaml) bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: subscription
          path: dist/clash.yaml
          retention-days: 14

      - name: Publish to secret gist
        if: env.GIST_ID != '' && env.GIST_TOKEN != ''
        run: |
          node -e '
            const fs = require("fs");
            const body = { files: { "clash.yaml": { content: fs.readFileSync("dist/clash.yaml", "utf8") } } };
            fetch(`https://api.github.com/gists/${process.env.GIST_ID}`, {
              method: "PATCH",
              headers: { Authorization: `Bearer ${process.env.GIST_TOKEN}`, "Content-Type": "application/json", "User-Agent": "node-radar-ci" },
              body: JSON.stringify(body)
            }).then(async (r) => { if (!r.ok) { console.error(await r.text()); process.exit(1); } })
              .catch((e) => { console.error(e); process.exit(1); });
          '

  notify:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = '[auto] 聚合流水线失败';
            const body = [
              '聚合任务失败，线上订阅保持上一版未覆盖。',
              '',
              `- 运行：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- 触发：${context.eventName}`,
              '',
              '常见原因：某个源返回异常内容导致内核校验不通过（守卫生效，未发布）。',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'pipeline',
            });
            const exist = issues.data.find(i => i.title === title);
            if (exist) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: exist.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['pipeline'] });
            }
