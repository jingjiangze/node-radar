name: aggregate-nodes

on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIST_ID: ${{ secrets.GIST_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: node scripts/aggregate.mjs

      - name: Show summary
        run: node -e "const s=require('./dist/summary.json');console.log('alive',s.totalAlive,'degraded',s.degraded,'regions',JSON.stringify(s.regions))"

      - name: Install mihomo (for validation)
        run: |
          set -e
          URL=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=(j.assets||[]).find(x=>/linux-amd64-compatible/.test(x.name)&&/\.gz$/.test(x.name));console.log(a?a.browser_download_url:'')})")
          curl -sSL -o mihomo.gz "$URL" && gunzip -f mihomo.gz && chmod +x mihomo

      # 关键兜底：生成物必须能被内核加载，否则不发布（不提交、不覆盖线上）
      - name: Validate generated config
        run: |
          set -e
          if [ -f dist/clash.yaml ]; then ./mihomo -t -d . -f dist/clash.yaml && echo "clash.yaml OK"; fi
          if [ -f dist/speed-top.yaml ]; then ./mihomo -t -d . -f dist/speed-top.yaml && echo "speed-top.yaml OK"; fi

      - name: Purge jsDelivr cache
        run: |
          curl -s -m 30 "https://purge.jsdelivr.net/gh/jingjiangze/node-radar@main/dist/clash.yaml" || true

      - name: Publish dist back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          git add -f dist/clash.yaml dist/summary.json
          git diff --cached --quiet || git commit -m "chore: update aggregated subscription"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: subscription
          path: dist/clash.yaml
          retention-days: 14

      - name: Publish to secret gist
        if: env.GIST_ID != '' && env.GIST_TOKEN != ''
        run: |
          node -e '
            const fs = require("fs");
            const body = { files: { "clash.yaml": { content: fs.readFileSync("dist/clash.yaml", "utf8") } } };
            fetch(`https://api.github.com/gists/${process.env.GIST_ID}`, {
              method: "PATCH",
              headers: { Authorization: `Bearer ${process.env.GIST_TOKEN}`, "Content-Type": "application/json", "User-Agent": "node-radar-ci" },
              body: JSON.stringify(body)
            }).then(async (r) => { if (!r.ok) { console.error(await r.text()); process.exit(1); } })
              .catch((e) => { console.error(e); process.exit(1); });
          '
