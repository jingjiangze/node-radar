name: cn-probe

# 中国大陆可达性探测（Globalping 众包探针）
#
# 额度按「出口 IP」算（250 探针次/小时），而 GitHub Actions 每次运行都拿不同 IP，
# 所以这里用**分片矩阵**：4 个 runner 并行，各吃自己那份额度 → 每小时 4×110=440 个目标，
# 全量 4596 个约 10.4 小时扫完一轮。每片 110×2=220 额度，仍在单 IP 250 之内。
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "每个分片最多探测多少个 host:port"
        default: "110"
      shards:
        description: "并行分片数（每片一个 runner，各自独立额度）"
        default: "4"

permissions:
  contents: write

concurrency:
  group: node-radar-publish
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Probe shard ${{ matrix.shard }}
        continue-on-error: true
        timeout-minutes: 35
        run: |
          node scripts/cn-probe-gp.mjs \
            --resume \
            --shard=${{ matrix.shard }} \
            --shards=${{ inputs.shards || '4' }} \
            --budget=${{ inputs.budget || '110' }} \
            --probes=2 \
            --concurrency=8 \
            --out=dist/cn-probe-${{ matrix.shard }}.json

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cn-probe-shard-${{ matrix.shard }}
          path: dist/cn-probe-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 2

  merge:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: cn-probe-shard-*
          path: dist
          merge-multiple: true

      - name: Merge into cn-probe.json
        run: node scripts/merge-probes.mjs

      - name: Show result
        run: |
          node -e "
            try {
              const r = require('./dist/cn-probe.json');
              console.log('累计', r.total, '条，可达', r.ok, '(' + r.okRate + '%)');
            } catch (e) { console.log('没有可合并的结果'); }
          "

      - name: Commit
        run: |
          set -e
          [ -f dist/cn-probe.json ] || { echo "没有结果可提交"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/cn-probe.json
          git diff --cached --quiet || git commit -m "chore: 中国大陆可达性探测结果（分片合并）"
          git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
          git push
