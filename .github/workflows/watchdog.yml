name: watchdog

# 流水线看门狗：GitHub 的 schedule 会延迟甚至跳过（负载高时常见），
# 而「没跑」和「跑了但没更新」从外面看不出来。这里定期检查最近一次成功运行的时间，
# 超过阈值就开 issue 报警（不自动重跑，避免失败时反复触发）。
on:
  schedule:
    - cron: "50 */3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const STALE_HOURS = 3.5;

            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'pipeline.yml', status: 'success', per_page: 1,
            });
            const last = runs.data.workflow_runs[0];
            const ageH = last ? (Date.now() - Date.parse(last.created_at)) / 3600e3 : Infinity;
            core.info(`最近一次成功运行：${last ? last.created_at : '无'}（${ageH.toFixed(1)} 小时前）`);

            if (ageH <= STALE_HOURS) {
              core.info('流水线正常，无需处理');
              // 如果之前报过警，恢复后自动关掉
              const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'pipeline' });
              for (const i of open.data) {
                if (i.title === '[auto] 流水线停摆') {
                  await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: `已恢复：最近一次成功运行 ${last.created_at}。` });
                  await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
                  core.info(`已关闭告警 issue #${i.number}`);
                }
              }
              return;
            }

            const body = [
              `**最近一次成功运行已经 ${ageH === Infinity ? '从未成功' : ageH.toFixed(1) + ' 小时'}**，超过阈值 ${STALE_HOURS} 小时。`,
              '',
              `- 最近成功：${last ? last.html_url : '无'}`,
              `- 流水线文件：\`.github/workflows/pipeline.yml\`（cron \`20 * * * *\`）`,
              '',
              '可能原因：GitHub schedule 被延迟/跳过；或流水线连续失败（失败会另开「[auto] 流水线失败」issue）。',
              '',
              '处理：先在 Actions 里手动跑一次 `pipeline`，看是否恢复。',
            ].join('\n');

            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'pipeline' });
            const exist = open.data.find(i => i.title === '[auto] 流水线停摆');
            if (exist) {
              await github.rest.issues.createComment({ owner, repo, issue_number: exist.number, body });
              core.info(`已在 issue #${exist.number} 追加评论`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title: '[auto] 流水线停摆', labels: ['pipeline'], body });
              core.info(`已创建告警 issue #${created.data.number}`);
            }
            core.setFailed(`流水线已 ${ageH === Infinity ? '从未成功' : ageH.toFixed(1) + ' 小时'} 没有成功运行`);
